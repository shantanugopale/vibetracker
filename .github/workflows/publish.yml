name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: publish packages (dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          npm publish --access public --provenance -w @vibetracker/core
          npm publish --access public --provenance -w @vibetracker/engines
          npm publish --access public --provenance -w @vibetracker/cli
          npm publish --access public --provenance -w @vibetracker/mcp
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
