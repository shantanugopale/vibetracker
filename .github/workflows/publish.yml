name: publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: check package versions match the pushed tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          node -e "
            const tag = process.argv[1].slice(1)
            for (const p of ['core', 'engines', 'cli', 'mcp']) {
              const version = require('./packages/' + p + '/package.json').version
              if (version !== tag) {
                console.error('@vibetracker/' + p + ' version ' + version + ' != tag ' + process.argv[1])
                process.exit(1)
              }
            }
            console.log('all packages at ' + tag + ' ✓')
          " "$TAG"

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: npm publish (OIDC trusted publishing, token fallback)
        run: |
          set -e
          for pkg in core engines cli mcp; do
            npm publish --access public --provenance -w "@vibetracker/$pkg"
            echo "@vibetracker/$pkg published ✓"
          done

      - name: summarize
        if: always()
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "### package published ✓ (OIDC if trusted publishing is configured, NPM_AUTH_TOKEN otherwise)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### published via OIDC trusted publishing (no NPM_AUTH_TOKEN set) ✓" >> "$GITHUB_STEP_SUMMARY"
            echo "If the publish step failed with ENEEDAUTH, configure trusted publishers:" >> "$GITHUB_STEP_SUMMARY"
            echo "npmjs.com → package → Settings → Trusted Publisher → GitHub Actions → shantanugopale/vibetracker → publish.yml" >> "$GITHUB_STEP_SUMMARY"
          fi
